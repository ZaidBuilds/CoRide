name: coride

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coride
      POSTGRES_PASSWORD: coride
      POSTGRES_DB: coride
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coride -d coride"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    # 6380, not 6379: another project (trafficai) already binds the host's 6379.
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://coride:coride@postgres:5432/coride
      REDIS_URL: redis://redis:6379
      # The image runs with NODE_ENV=production, which refuses to boot without
      # a strong secret. Put AUTH_SECRET (openssl rand -base64 48) in ./.env.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BEACHHEAD_LINE: ${BEACHHEAD_LINE:-blue}
      BEACHHEAD_STATIONS: ${BEACHHEAD_STATIONS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    # vite preview via nginx in Dockerfile

volumes:
  pgdata:
  redisdata:
